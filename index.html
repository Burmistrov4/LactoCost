  <script>
    /* Compatibility patch for Chrome extensions and interceptors */
    (function() {
      try {
        var rawFetch = window.fetch;
        var boundFetch = rawFetch ? function() {
          return rawFetch.apply(window, arguments);
        } : null;
        var activeFetch = boundFetch;

        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: function() {
            return activeFetch;
          },
          set: function(fn) {
            activeFetch = fn;
          }
        });
      } catch (e) {
        try {
          Object.defineProperty(Window.prototype, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            }
          });
        } catch (_) {}
      }

      window.addEventListener('error', function(event) {
        if (event && (
          (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
          (event.message && (
            event.message.indexOf('Cannot set property fetch') !== -1 ||
            event.message.indexOf('chrome-extension') !== -1
          ))
        )) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var stack = (reason && reason.stack) || (reason && reason.message) || '';
        if (typeof stack === 'string' && (
          stack.indexOf('chrome-extension://') !== -1 ||
          stack.indexOf('Cannot set property fetch') !== -1
        )) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    })();
  </script>
